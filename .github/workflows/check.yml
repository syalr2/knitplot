name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: knitplot_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: knitplot_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://knitplot_test:test_only@localhost:5432/knitplot_test
      TEST_DATABASE_URL: postgres://knitplot_test:test_only@localhost:5432/knitplot_test
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ""
      CLERK_SECRET_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run test:db
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
